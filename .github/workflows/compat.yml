name: Compat

# Temporary apps on the oldest supported React Native (old architecture) and on the latest React Native.
on:
  pull_request:
    branches: [master, 'feature/**']
  push:
    branches: [master, 'feature/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The native jobs use only released native SDK artifacts, at the version that package.json pins.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        run: |
          version=$(jq -r '.codelloyNative.version // empty' package.json)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "No native SDK release is pinned in package.json (codelloyNative) yet. The compat jobs are skipped. They start after the first release." >>"$GITHUB_STEP_SUMMARY"
          fi

  app:
    needs: release
    if: needs.release.outputs.version != ''
    name: ${{ matrix.react-native }} ${{ matrix.arch }} ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-native: 0.74.7
            arch: old
            platform: ios
            runner: macos-26
          - react-native: 0.74.7
            arch: old
            platform: android
            runner: ubuntu-24.04
          - react-native: latest
            arch: new
            platform: ios
            runner: macos-26
          - react-native: latest
            arch: new
            platform: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'ios'
        uses: ./.github/actions/native
      - run: npm ci
      - run: scripts/compat-app.sh "${{ matrix.react-native }}" "${{ matrix.arch }}" "${{ matrix.platform }}" "$RUNNER_TEMP/compat"
