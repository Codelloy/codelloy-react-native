name: Release

# The operator starts each release by hand after approval. Start it first with publish off: a dry run runs each check
# and packs the package, and publishes nothing. README.md, Release, lists the steps before this workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package to npm. Off for a dry run.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  # The example and the compatibility apps on the native SDK release that package.json pins.
  example:
    uses: ./.github/workflows/example.yml
  compat:
    uses: ./.github/workflows/compat.yml

  # The package as npm publishes it, as an artifact of the run.
  pack:
    needs: [ci, example, compat]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # prepack (scripts/fetch-native.sh) puts the pinned XCFramework into ios/Frameworks. It stops on each error, also
      # on the placeholder pin.
      - run: npm pack
      - run: tar -tzf codelloy-react-native-*.tgz | grep -q '^package/ios/Frameworks/CodelloySDK.xcframework/Info.plist$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: codelloy-react-native-*.tgz
          if-no-files-found: error

  # publish on another branch fails the run. Without this job, the publish job is skipped and the run is green.
  branch:
    if: inputs.publish && github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "publish runs only on master. Start the release on master." >&2
          exit 1

  publish:
    needs: pack
    if: inputs.publish && github.ref == 'refs/heads/master'
    # The environment holds the secret NPM_TOKEN. It allows only master, and its required reviewer approves the publish.
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # npm signs the provenance statement with the OIDC token of the run.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      # The tarball of the pack job. npm runs no script of the package for a tarball.
      - run: npm publish codelloy-react-native-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
