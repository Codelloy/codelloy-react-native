name: Native SDK release
description: >-
  Puts the XCFramework of the codelloy-ios release that package.json pins (codelloyNative.version and
  codelloyNative.sha256) into ios/Frameworks/. Android needs no step: Gradle gets com.codelloy:codelloy-android from
  Maven Central.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        version=$(jq -r .codelloyNative.version package.json)
        zip=$RUNNER_TEMP/CodelloySDK.xcframework.zip
        curl -fsSL --retry 3 -o "$zip" \
          "https://github.com/Codelloy/codelloy-ios/releases/download/$version/CodelloySDK-$version.xcframework.zip"
        echo "$(jq -r .codelloyNative.sha256 package.json)  $zip" | shasum -a 256 -c -
        rm -rf ios/Frameworks
        mkdir -p ios/Frameworks
        unzip -q "$zip" -d ios/Frameworks
